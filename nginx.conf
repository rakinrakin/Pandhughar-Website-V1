server {
  listen 8080;
  listen 3000;   # also answer on 3000 in case the platform routes there
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # long cache for media, short for the page itself
  location ~* \.(?:mp4|webp|jpg|jpeg|png|svg|woff2?)$ { expires 30d; add_header Cache-Control "public"; }
  location ~* \.(?:css|js)$ { expires 1h; }
  location / { try_files $uri $uri/ /index.html; }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
}
